name: undo-capital

services:
  db:
    container_name: db
    image: postgres:16
    command:
      - 'postgres'
      - '-c'
      - 'max_connections=50'
      - '-c'
      - 'shared_buffers=1GB'
      - '-c'
      - 'effective_cache_size=4GB'
      - '-c'
      - 'work_mem=16MB'
      - '-c'
      - 'maintenance_work_mem=1GB'
      - '-c'
      - 'random_page_cost=1.1'
      - '-c'
      - 'temp_file_limit=10GB'
      - '-c'
      - 'log_min_duration_statement=200ms'
      - '-c'
      - 'idle_in_transaction_session_timeout=10s'
      - '-c'
      - 'lock_timeout=1s'
      - '-c'
      - 'statement_timeout=60s'
      - '-c'
      - 'shared_preload_libraries=pg_stat_statements'
      - '-c'
      - 'pg_stat_statements.max=10000'
      - '-c'
      - 'pg_stat_statements.track=all'
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./undo-capital-db/scripts:/docker-entrypoint-initdb.d
    ports:
      - '${DB_PORT}:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"  
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G
    networks:
      - undo-capital-network    

  api:
    container_name: api
    build:
      target: development
      context: ./api
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./api:/usr/src/app
      - /usr/src/app/node_modules
    expose:
      - '${API_PORT}'
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$$API_PORT/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s    
    networks:
      - undo-capital-network


  minio:
    image: quay.io/minio/minio:latest
    command: server /data --json --console-address ':9090'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    healthcheck:
      test: [ 'CMD', 'mc', 'ready', 'local' ]
      interval: 5s
      timeout: 5s
      retries: 5   
    hostname: minio
    volumes: [ ./minio-data:/data:rw ]
    restart: unless-stopped
    ports:
      - '9000:9000'
    networks:
      - undo-capital-network  

  nginx:
    container_name: nginx
    restart: unless-stopped
    build:
      context: ./nginx
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./data/nginx:/etc/nginx/conf.d
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - static-content:/usr/src/app
    ports:
      - '80:80'
      - '443:443'
    healthcheck:
        test: ["CMD", "curl", "--fail", "http://localhost/healthcheck"]
        interval: 30s
        timeout: 10s
        retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - undo-capital-network
      
  redis:
    container_name: redis
    image: 'redis:latest'
    env_file: .env
    command: /bin/sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    ports:
      - '6379:${REDIS_PORT}'
    restart: unless-stopped
    volumes:
      - undo-capital-redis:/data/redis
    logging:
      options:
        max-size: "10m"    
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG" ]
      interval: 1s
      timeout: 3s
      retries: 5
    networks:
      - undo-capital-network

  certbot:
    container_name: certbot
    image: certbot/certbot
    profiles:
    - donotstart
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    networks:
      - undo-capital-network

volumes:
  pgdata:
  undo-capital-redis:
  static-content:


networks:
  undo-capital-network:
